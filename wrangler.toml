name = "moontv"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm install --legacy-peer-deps && npm run pages:build"
publish = ".vercel/output/static"

[[pages.redirects]]
source = "/api/*"
destination = "/api/:splat"
status_code = 301

[[pages.functions]]
globs = ["app/api/**/*.{ts,tsx}"]
runtime = "edge"